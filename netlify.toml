[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"
  # tinacms build necesita más heap del default de Node para indexar (evita
  # "JavaScript heap out of memory" en el paso de Tina).
  NODE_OPTIONS = "--max-old-space-size=4096"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
